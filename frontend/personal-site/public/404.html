<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // GitHub Pages serves this for any unknown path (e.g. a reload on /about).
      // Stash the URL and send the browser to the app root; index.html restores it.
      sessionStorage.redirect = location.href;
      location.replace('/');
    </script>
  </head>
  <body>
    <p>If you are not redirected automatically, follow this <a href="/">link to the main page</a>.</p>
  </body>
</html>
