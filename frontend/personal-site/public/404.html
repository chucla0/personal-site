<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // GitHub Pages serves this for any unknown path (e.g. a reload on /personal-site/about).
      // Stash the URL and send the browser to the app root; index.html restores it.
      // The root must include the repo base path, not '/', or it lands on chucla0.github.io.
      sessionStorage.redirect = location.href;
      location.replace('/personal-site/');
    </script>
  </head>
  <body>
    <p>If you are not redirected automatically, follow this <a href="/personal-site/">link to the main page</a>.</p>
  </body>
</html>
